schema_version: checkrcq-hardware-final-evidence-design-v1
design_id: sigmetrics-2027-final-hardware-evidence-v1
campaign_id: hardware_lih_sigmetrics_2027_final_evidence_campaign
declared_before_scientific_execution: true
outcome_based_stopping: false

backend_selection:
  candidate_count: 7
  maximum_5q_backends: 5
  maximum_7q_backends: 3
  architecture_diversity_rule: Boston if eligible, one additional Heron-r3, up to two Heron-r2, one Nighthawk
  category_tie_break: lowest pending jobs then backend name

qualification:
  fit_executions_per_backend: 8
  heldout_executions_per_backend: 4
  jobs_per_execution: 2
  jobs_per_backend: 24
  qualification_rule: exactly 4/4 held-out stable trajectories
  failed_backends_recalibrated: false

evaluation:
  every_qualified_backend_is_source: true
  five_q_blocks_per_source: 3
  seven_q_blocks_per_source: 2
  migration_targets_per_source_maximum: 2
  jobs_per_block_zero_targets: 11
  jobs_per_block_one_target: 13
  jobs_per_block_two_targets: 15
  shared_counterfactuals_across_policies: true

maximum_population:
  qualification_5q: {jobs: 120, circuits: 3000, shots: 576000}
  evaluation_5q: {jobs: 225, circuits: 3300, shots: 633600}
  qualification_7q: {jobs: 72, circuits: 1800, shots: 345600}
  evaluation_7q: {jobs: 90, circuits: 1320, shots: 253440}
  temporal_diagnostics: {jobs: 60, circuits: 1500, shots: 288000}
  total: {jobs: 567, circuits: 10920, shots: 2096640}

budget:
  new_campaign_provider_qpu_seconds: 2700
  checked_before_every_submission: true
  minimum_complete_unit_reserved_before_start: true
  queue_delay_included: false
  predecessor_charge_reported_separately: true

claim_guards:
  finite_counts_not_population_probabilities: true
  failed_qualification_visible: true
  incomplete_tiers_not_completed_claims: true
  modeled_duration_not_measured_qpu_savings: true
  hardware_cross_algorithm_generalization_forbidden: true

