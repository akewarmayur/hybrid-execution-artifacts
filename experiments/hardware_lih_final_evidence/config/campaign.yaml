schema_version: checkrcq-hardware-final-evidence-v1
campaign_id: hardware_lih_sigmetrics_2027_final_evidence_campaign
purpose: large predeclared live-hardware characterization and evaluation of RES-Q across independently qualified backend/windows

predecessors:
  - campaign_id: hardware_lih_sigmetrics_2027
    role: immutable_qualification_study
  - campaign_id: hardware_lih_sigmetrics_2027_scaled_followup
    role: immutable_qualification_study

authentication:
  legacy_config: configs/hardware/e3_hw_live.yaml

science:
  workload: lih_vqe
  paper_profile: paper
  scale_profile: review_large
  boundary: B5
  seed: 73
  optimizer_iterations: 2
  continuation_horizon_B: 2
  stable_window_steps: 2
  b5_completed_groups: [2, 4, 6]
  shots_per_circuit: 192
  spsa_epsilon: 0.08
  transpiler_seed: 73
  optimization_level: 1

candidate_backends:
  - ibm_boston
  - ibm_pittsburgh
  - ibm_kingston
  - ibm_marrakesh
  - ibm_fez
  - ibm_miami
  - ibm_phoenix

selection:
  maximum_5q_backends: 5
  include_boston_if_eligible: true
  additional_heron_r3: 1
  heron_r2: 2
  nighthawk: 1
  within_category_order: [pending_jobs_ascending, backend_name_ascending]
  scientific_outcomes_used: false
  maximum_7q_backends: 3

calibration:
  fit_executions_per_backend: 8
  heldout_executions_per_backend: 4
  threshold_rule: empirical_quantile_higher
  requested_quantile: 0.99
  gradient_noise_floor_quantile: 0.95
  exactly_one_population_per_backend_profile: true

qualification:
  required_stable_heldout: 4
  heldout_population: 4
  independent_per_backend: true

evaluation:
  five_q_blocks_per_qualified_source: 3
  seven_q_blocks_per_qualified_source: 2
  maximum_targets_per_source: 2
  planner_operating_points: [0.15, 0.05]
  block_change_delay_threshold: 0.05
  policies: [blind_replay, replay_then_migrate, block_on_change, resq_tau_0_15, resq_tau_0_05]

diagnostics:
  trajectories_per_backend: 10
  backends:
    - backend: ibm_marrakesh
      predecessor: hardware_lih_sigmetrics_2027
    - backend: ibm_pittsburgh
      predecessor: hardware_lih_sigmetrics_2027_scaled_followup
    - backend: ibm_kingston
      predecessor: hardware_lih_sigmetrics_2027_scaled_followup

runtime:
  primitive: SamplerV2
  max_retries: 1
  mitigation_options: none

budget:
  target_new_qpu_budget_seconds: 2700
  estimated_job_floor_seconds: 15
  estimated_seconds_per_shot_circuit: 0.001
  lower_provider_limit_takes_precedence: true
  queue_delay_included: false
  minimum_scientific_unit_guard: true

priority_order:
  - qualification_5q
  - evaluation_5q
  - qualification_7q
  - evaluation_7q
  - temporal_diagnostics

tier_status_schema:
  - not_started
  - running
  - complete
  - qualification_failed
  - unavailable
  - incomplete_budget
  - incomplete_operational
  - failed

