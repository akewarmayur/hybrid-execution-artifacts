schema_version: checkrcq-hardware-lih-scaled-followup-v1
campaign_id: hardware_lih_sigmetrics_2027_scaled_followup
predecessor_campaign: hardware_lih_sigmetrics_2027
predecessor_gate_result: failed
reason: independent scaled follow-up after the predecessor qualification campaign detected backend/window instability on Marrakesh

authentication:
  mechanism: legacy_qiskit_runtime_saved_account_then_environment
  legacy_config: configs/hardware/e3_hw_live.yaml

science:
  workload: lih_vqe
  paper_profile: paper
  scale_profile: review_large
  boundary: B5
  seed: 73
  optimizer_iterations: 2
  continuation_horizon_B: 2
  stable_window_steps: 2
  b5_completed_groups: [2, 4, 6]
  shots_per_circuit: 192
  spsa_epsilon: 0.08
  transpiler_seed: 73
  optimization_level: 1

profiles:
  paper:
    qubits: 5
    hamiltonian_terms: 40
    measurement_groups: 8
    parameters: 20
    calibration_fit_executions_per_backend: 8
    calibration_heldout_executions_per_backend: 4
    evaluation_blocks: 10
  review_large:
    qubits: 7
    hamiltonian_terms: 56
    measurement_groups: 8
    parameters: 28
    calibration_fit_executions_per_backend: 8
    calibration_heldout_executions_per_backend: 4
    evaluation_blocks: 5

backends:
  source: ibm_pittsburgh
  primary_target: ibm_boston
  additional_target_preference: [ibm_kingston, ibm_fez]
  predecessor_diagnostic_backend: ibm_marrakesh
  target_c_selection_inputs:
    - operational_status
    - sufficient_qubits
    - required_instruction_support
    - successful_compilation_paper_and_review_large
    - primitive_availability
    - current_queue_metadata
    - deterministic_configured_preference

calibration:
  threshold_rule: empirical_quantile_higher
  requested_quantile: 0.99
  gradient_noise_floor_quantile: 0.95
  finite_sample_effect: threshold equals maximum observed fit deviation
  exactly_one_population_per_backend_and_profile: true

qualification:
  source_requires_stable_heldout: 4
  target_requires_stable_heldout: 4
  require_at_least_one_migration_target: true
  per_backend_independent: true

diagnostic:
  trajectories: 20
  jobs_per_trajectory: 2
  use_predecessor_frozen_envelope: true
  diagnostic_only: true
  cannot_change_qualification: true

planner:
  operating_points: [0.15, 0.05]
  block_change_delay_threshold: 0.05
  tune_on_hardware_evaluation: false
  shared_counterfactuals_across_policies: true

runtime:
  primitive: SamplerV2
  max_retries: 1
  job_mode: true
  mitigation_options: none

budget:
  project_hard_qpu_cap_seconds: 3000
  include_predecessor_durable_ledger: true
  estimated_job_floor_seconds: 15
  estimated_seconds_per_shot_circuit: 0.001
  exclude_queue_delay: true
  missing_provider_qpu_charge_fallback: conservative_execution_wall_proxy

priority_order:
  - calibration_5q
  - evaluation_5q
  - marrakesh_diagnostic
  - calibration_7q
  - evaluation_7q

tier_status_schema:
  - not_started
  - running
  - complete
  - qualification_failed
  - incomplete_budget
  - incomplete_operational
  - failed

