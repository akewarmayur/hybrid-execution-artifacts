schema_version: checkrcq-hardware-lih-vertical-v1
campaign_id: hardware_lih_sigmetrics_2027
purpose: controlled end-to-end LiH VQE validation of RES-Q restart behavior on live IBM QPUs

authentication:
  mechanism: legacy_qiskit_runtime_saved_account_then_environment
  legacy_config: configs/hardware/e3_hw_live.yaml

science:
  workload: lih_vqe
  profile: paper
  optional_scale_profile: review_large
  boundary: B5
  seed: 73
  optimizer_iterations: 2
  continuation_horizon_B: 2
  stable_window_steps: 2
  b5_completed_groups: [2, 4, 6]
  shots_per_circuit: 192
  pilot_shots: 64
  spsa_epsilon: 0.08
  transpiler_seed: 73
  optimization_level: 1

backends:
  source_preference:
    - ibm_pittsburgh
    - ibm_marrakesh
    - ibm_boston
    - ibm_kingston
    - ibm_fez
    - ibm_phoenix
    - ibm_miami
  target_preference:
    - ibm_marrakesh
    - ibm_boston
    - ibm_kingston
    - ibm_fez
    - ibm_phoenix
    - ibm_miami
    - ibm_pittsburgh

hardware_calibration:
  fit_executions_per_backend: 8
  validation_executions_per_backend: 4
  estimator: aligned_spsa_gradient_and_grouped_objective
  threshold_rule: empirical_quantile_higher
  requested_quantile: 0.99
  finite_sample_effect: threshold equals maximum observed fit deviation

evaluation_windows:
  - hardware-evaluation-window-01

planner:
  operating_points: [0.15, 0.05]
  block_change_delay_threshold: 0.05
  tune_on_hardware_evaluation: false

runtime:
  primitive: SamplerV2
  max_retries: 1
  job_mode: true
  mitigation_options: none

budget:
  default_qpu_budget_seconds: 2700
  estimated_job_floor_seconds: 15
  estimated_seconds_per_shot_circuit: 0.001

provenance:
  live: live_ibm
  cached: cached_live_ibm
  simulation: simulation
  offline: offline_counterfactual_analysis
