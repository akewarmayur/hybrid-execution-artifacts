experiment_name: resume_spotcheck_live
results_subdir: resume_spotcheck_live
description: >
  Clean live-only same-backend replay spot-checks on IBM hardware. This config is
  intended for paper reporting when you want replay-on-hardware evidence without
  mixing in any deterministic fallback windows.
benchmark_profile: paper
hardware_windows:
  - AUTO_UTC
optimizer_iterations: 2
shots_per_group: 768
budget_B: 2
use_mock_hardware: false
use_live_hardware: true
allow_live_fallback: false
use_inline_account: true
inline_channel: ibm_cloud
inline_instance: "<REDACTED_IBM_INSTANCE>"
inline_name: "<REDACTED_SAVED_ACCOUNT_NAME>"
hardware_case_seeds:
  - 5
  - 11
live_shots_per_job: 192
max_live_cases: 4
append_existing: true
cases:
  - case_id: lih_b3_replay_pittsburgh
    case_label: LiH B3 replay
    family: resume_spotcheck
    workload_name: lih_vqe
    boundary: B3
    scenario: same_backend_replay
    baseline_or_ablation: full_contract
    save_backend: ibm_pittsburgh
    restore_backend: ibm_pittsburgh
    delay: 0.5
  - case_id: lih_b5_replay_pittsburgh
    case_label: LiH B5 replay
    family: resume_spotcheck
    workload_name: lih_vqe
    boundary: B5
    scenario: same_backend_replay
    baseline_or_ablation: full_contract
    save_backend: ibm_pittsburgh
    restore_backend: ibm_pittsburgh
    delay: 0.5
  - case_id: h2_b3_replay_marrakesh
    case_label: H2 B3 replay
    family: resume_spotcheck
    workload_name: h2_vqe
    boundary: B3
    scenario: same_backend_replay
    baseline_or_ablation: full_contract
    save_backend: ibm_marrakesh
    restore_backend: ibm_marrakesh
    delay: 0.5
  - case_id: h2_b5_replay_marrakesh
    case_label: H2 B5 replay
    family: resume_spotcheck
    workload_name: h2_vqe
    boundary: B5
    scenario: same_backend_replay
    baseline_or_ablation: workflow_lite
    save_backend: ibm_marrakesh
    restore_backend: ibm_marrakesh
    delay: 0.5
