experiment_name: migration_matrix
results_subdir: migration_matrix
description: >
  Supplemental cross-backend migration matrix on live IBM hardware. This strengthens
  the paper's migration story beyond the main selected M3 cases while staying small
  enough to run opportunistically.
benchmark_profile: paper
hardware_windows:
  - AUTO_UTC
optimizer_iterations: 2
shots_per_group: 768
budget_B: 2
use_mock_hardware: true
use_live_hardware: true
allow_live_fallback: true
use_inline_account: true
inline_channel: ibm_cloud
inline_instance: "<REDACTED_IBM_INSTANCE>"
inline_name: "<REDACTED_SAVED_ACCOUNT_NAME>"
hardware_case_seeds:
  - 5
  - 11
live_shots_per_job: 192
max_live_cases: 4
append_existing: true
cases:
  - case_id: lih_b5_pittsburgh_to_marrakesh
    case_label: LiH Pitt→Marr
    family: migration_matrix
    workload_name: lih_vqe
    boundary: B5
    scenario: cross_backend_migration
    baseline_or_ablation: full_contract
    save_backend: ibm_pittsburgh
    restore_backend: ibm_marrakesh
    delay: 0.5
  - case_id: lih_b5_pittsburgh_to_fez
    case_label: LiH Pitt→Fez
    family: migration_matrix
    workload_name: lih_vqe
    boundary: B5
    scenario: cross_backend_migration
    baseline_or_ablation: full_contract
    save_backend: ibm_pittsburgh
    restore_backend: ibm_fez
    delay: 0.5
  - case_id: h2_b3_marrakesh_to_pittsburgh
    case_label: H2 Marr→Pitt
    family: migration_matrix
    workload_name: h2_vqe
    boundary: B3
    scenario: cross_backend_migration
    baseline_or_ablation: full_contract
    save_backend: ibm_marrakesh
    restore_backend: ibm_pittsburgh
    delay: 0.5
  - case_id: h2_b3_fez_to_pittsburgh
    case_label: H2 Fez→Pitt
    family: migration_matrix
    workload_name: h2_vqe
    boundary: B3
    scenario: cross_backend_migration
    baseline_or_ablation: full_contract
    save_backend: ibm_fez
    restore_backend: ibm_pittsburgh
    delay: 0.5
