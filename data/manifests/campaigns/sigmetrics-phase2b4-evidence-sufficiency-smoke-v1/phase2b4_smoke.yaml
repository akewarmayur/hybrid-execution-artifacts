setting: noisy
evaluation_question: phase2b4_decision_evidence_sufficiency_smoke
benchmark_profile: reduced
workloads: [lih_vqe, h2_vqe, qaoa_maxcut, adapt_vqe]
source_backend: ibm_kyiv
optimizer_iterations: 2
shots_per_group: 128
continuation_horizon_B: 4
evaluation_seed: 811
block_change_delay_threshold: 0.05
phase2b3_operating_point_artifact: outputs/diagnostics/phase2b3/sigmetrics-phase2b3-policy-evaluation-smoke-v1/planner_calibration/selected_operating_point.json
variant_design: predeclared_full_leave_one_out_and_s0_through_s5_nested
evaluation_scenarios:
  - name: lih_no_change_partial_progress
    workload: lih_vqe
    changed_context_class: no_change_partial_external_work
    replay_delay: 0.0
    replay_available: true
    migration_targets: []
  - name: h2_delayed_replay
    workload: h2_vqe
    changed_context_class: same_backend_delay
    replay_delay: 4.0
    replay_available: true
    migration_targets: [ibm_sherbrooke]
  - name: qaoa_migration_opportunity
    workload: qaoa_maxcut
    changed_context_class: cross_backend
    replay_delay: 0.0
    replay_available: false
    migration_targets: [ibm_sherbrooke, ibm_brisbane]
  - name: adapt_high_change
    workload: adapt_vqe
    changed_context_class: high_change_conservative_block
    replay_delay: 8.0
    replay_available: true
    migration_targets: [ibm_brisbane]
    migration_delays: {ibm_brisbane: 6.0}
  - name: lih_detected_but_safe_change
    workload: lih_vqe
    changed_context_class: low_change_safe_replay
    replay_delay: 0.10
    replay_available: true
    migration_targets: []
  - name: h2_semantic_mismatch
    workload: h2_vqe
    changed_context_class: semantic_incompatibility
    semantic_identity_matches: false
    replay_delay: 0.0
    replay_available: true
    migration_targets: [ibm_sherbrooke]
