setting: noisy
evaluation_question: phase2b3_same_state_policy_smoke
benchmark_profile: reduced
workloads: [lih_vqe, h2_vqe, qaoa_maxcut, adapt_vqe]
source_backend: ibm_kyiv
optimizer_iterations: 2
shots_per_group: 128
continuation_horizon_B: 4
planner_calibration_seed: 607
evaluation_seed: 811
planner_threshold_sweep: [0.15, 0.30, 0.50, 0.75]
minimum_calibration_coverage: 0.60
block_change_delay_threshold: 0.05
planner_calibration_scenarios:
  - name: lih_no_change
    workload: lih_vqe
    changed_context_class: no_change
    replay_delay: 0.0
    replay_available: true
    migration_targets: []
  - name: h2_delayed_replay
    workload: h2_vqe
    changed_context_class: same_backend_delay
    replay_delay: 4.0
    replay_available: true
    migration_targets: [ibm_sherbrooke]
  - name: qaoa_migration_opportunity
    workload: qaoa_maxcut
    changed_context_class: cross_backend
    replay_delay: 0.0
    replay_available: false
    migration_targets: [ibm_sherbrooke, ibm_brisbane]
  - name: adapt_high_change
    workload: adapt_vqe
    changed_context_class: high_change
    replay_delay: 8.0
    replay_available: true
    migration_targets: [ibm_brisbane]
    migration_delays: {ibm_brisbane: 6.0}
  - name: lih_detected_but_safe_change
    workload: lih_vqe
    changed_context_class: conservative_change
    replay_delay: 0.10
    replay_available: true
    migration_targets: []
