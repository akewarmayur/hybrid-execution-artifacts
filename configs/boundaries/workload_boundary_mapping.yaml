schema_version: checkrcq-boundary-mapping-v1
workloads:
  vqe:
    B1: problem/Hamiltonian state
    B2: grouping and shot plan
    B3: compiled ansatz
    B4: optimizer iteration
    B5: partial measurement groups
    B6: null
  adapt_vqe:
    B1: problem/Hamiltonian state
    B2: grouping and shot plan
    B3: compiled evolving ansatz
    B4: optimizer iteration
    B5: partial measurement groups
    B6: ADAPT operator expansion
  qaoa:
    B1: graph/cost state
    B2: evaluation and shot plan
    B3: compiled QAOA circuit
    B4: optimizer iteration
    B5: partial cost evaluations
    B6: null
  qml_vqc:
    B1: dataset/split/preprocessing/encoding identity
    B2: minibatch/sample/shot plan and RNG
    B3: compiled classifier and parameter binding
    B4: committed training step and optimizer state
    B5: partial samples/evaluations and accumulators
    B6: null
new_boundary_required_for_qml: false
