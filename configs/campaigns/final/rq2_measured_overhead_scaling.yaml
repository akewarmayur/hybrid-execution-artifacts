schema_version: checkrcq-campaign-v1
campaign_id: sigmetrics-rq2-overhead-scaling-final-v1
status: planned
profile: review_large
rqs: [RQ2]
repetition_role: evaluation
output_root: outputs/sigmetrics/rq2_overhead_scaling
expected_checkpoint_count_per_run: 2
shots_per_group: 512
axes:
  workload: [h2_vqe, lih_vqe, adapt_vqe, qaoa_maxcut]
  workload_profile: [reduced, paper, review_large]
  execution_mode: [ideal_sim, noisy_sim]
  checkpoint_boundary: [B3, B5]
  checkpoint_cadence: [1]
  persistence_target: [local_durable, temporary_test]
  continuation_horizon_B: [4]
  stable_window_steps: [2]
  seed: [1101, 1102, 1103]
seed_roles:
  smoke_seeds: [2]
  calibration_seeds: []
  planner_calibration_seeds: []
  evaluation_seeds: [1101, 1102, 1103]
dependencies: []
persistence_targets:
  local_durable:
    type: local_durable_filesystem
    path: outputs/checkpoints
    durability_semantics: fsync payload, commit record, and containing directory
  temporary_test:
    type: temporary_test_filesystem
    path: /private/tmp/checkrcq-persistence
    durability_semantics: process-local test durability only; not a network filesystem
budgets:
  max_runs: 500
  max_simulation_shots: 10000000
  max_hardware_jobs: 0
  max_hardware_shots: 0
