schema_version: checkrcq-claim-requirements-v1
claims:
  semantic_vs_timer:
    requires: [phase2b2_periodic_records, matching_audit]
  reduces_unsafe_continuation:
    requires: [phase2b3_same_state_policy, nonzero_proceed_denominator, coverage]
  decision_critical_metadata:
    requires: [phase2b4_action_effect]
  low_overhead:
    requires: [measured_timing_provenance]
  hardware_confirms:
    requires: [verified_live_or_cached_live, canonical_success_semantics, no_mock_mixing]
  generalizes_qaoa:
    requires: [calibrated_authoritative_qaoa_evaluation]
  generalizes_qml:
    enabled: false
    deferred_until: authoritative_phase2d_qml_evaluation
    requires: [valid_qml_calibration, b1_b5_exercised, targeted_recovery_validated, same_backend_replay_validated]
